[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "w0rm-gpt"
version = "2.0.0"
description = "W0rm-GPT Educational CLI - Cross-platform build"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Team Sincryption", email = "team@example.com" }]
keywords = ["ai", "chatgpt", "cli", "wormgpt", "educational"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.8"
dependencies = [
  "colorama>=0.4.6",
  "openai>=0.28.0",
  "requests>=2.28.0",
  "pycryptodome>=3.18.0",
  "python-dotenv>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/samay825/W0rm-Gpt"
Repository = "https://github.com/samay825/W0rm-Gpt"
Issues = "https://github.com/samay825/W0rm-Gpt/issues"

[project.scripts]
wormgpt = "main:main"

[tool.setuptools]
py-modules = ["main", "update"]

[tool.setuptools.packages.find]
exclude = ["tests", "docs"]

[project.optional-dependencies]
dev = ["build", "wheel", "pyinstaller"]
